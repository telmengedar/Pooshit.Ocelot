name: publish
on:
  push:
    tags: ['v*']

permissions:
  id-token: write   # REQUIRED for OIDC token issuance
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Derive version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Test
        run: dotnet test Ocelot.Tests/Ocelot.Tests.csproj -c Release
      - name: Pack
        run: dotnet pack Ocelot/Ocelot.csproj -c Release -p:Version=${{ steps.ver.outputs.version }} -p:ContinuousIntegrationBuild=true -o "${{ runner.temp }}/pkg"
      - name: NuGet login (OIDC -> short-lived key)   # MUST be right before push (key ~1h, single-use)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push
        run: dotnet nuget push "${{ runner.temp }}/pkg/*.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
